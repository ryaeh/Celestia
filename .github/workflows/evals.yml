name: Evals (real models)

# Runs the Gate A evals (tool-calling + graph extraction) against real Ollama
# models on GitHub's CPU runners, so results don't need a local GPU.
# Small models by default (≤ 4B): each takes ~30–60 min on CPU with 3 repeats.
# 7–9B models work too via "Run workflow" (expect 1–3 h each; use repeat 1–2).
#
# Tool-calling runs at the model's own temperature ("model"), like Celestia's chat
# loop, with several repeats so run-to-run noise shows up as a ± spread.
# Extraction runs at temperature 0, like the production extractor.
#
# Results: the run's Summary page (comparison table + misses) and the
# "eval-results-*" artifacts (full per-case JSON).

on:
  workflow_dispatch:
    inputs:
      models:
        description: "Ollama models, comma-separated (must support tools)"
        default: "llama3.2:3b,qwen2.5:3b,qwen3:4b,qwen3.5:4b"
        required: true
      repeat:
        description: "Tool-call repeats per case (spread needs ≥ 2)"
        default: "3"
      temperature:
        description: "Tool-call sampling: 'model' (production) or a number"
        default: "model"
      think:
        description: "Thinking for reasoning models: off | on | default"
        default: "off"
      ollama_version:
        description: "Pin the Ollama version (e.g. 0.12.3); empty = latest"
        default: ""
      extraction:
        description: "Also run the graph-extraction eval"
        type: boolean
        default: true
  pull_request:
    branches: [main]
    paths:
      - "evals/**"
      - "skills/registry.py"
      - "skills/*/tools.py"
      - "celestia_core/agent.py"
      - "celestia_core/personality.py"
      - "personalities/**"
      - "skills/memory/graph_extract.py"
      - ".github/workflows/evals.yml"

concurrency:
  group: evals-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      models: ${{ steps.m.outputs.models }}
    steps:
      - id: m
        env:
          MODELS: ${{ inputs.models || 'llama3.2:3b,qwen2.5:3b,qwen3:4b,qwen3.5:4b' }}
        run: |
          python3 -c "import json,os; print('models=' + json.dumps([m.strip() for m in os.environ['MODELS'].split(',') if m.strip()]))" >> "$GITHUB_OUTPUT"

  eval:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        model: ${{ fromJSON(needs.plan.outputs.models) }}
    env:
      MODEL: ${{ matrix.model }}
      RUN_EXTRACTION: ${{ github.event_name == 'pull_request' || inputs.extraction }}
      REPEAT: ${{ inputs.repeat || '3' }}
      TEMPERATURE: ${{ inputs.temperature || 'model' }}
      THINK: ${{ inputs.think || 'off' }}
      # Pinned so results stay comparable across runs; bump deliberately and
      # re-baseline. Each results JSON records the version that actually ran.
      OLLAMA_VERSION: ${{ inputs.ollama_version || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python deps
        run: pip install -r requirements-dev.txt

      - name: Slug
        id: slug
        run: echo "slug=$(echo "$MODEL" | tr -c 'A-Za-z0-9.\n' '-')" >> "$GITHUB_OUTPUT"

      - name: Cache Ollama models
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ steps.slug.outputs.slug }}-v1

      - name: Install + start Ollama
        run: |
          # install.sh honours OLLAMA_VERSION (empty = latest release)
          curl -fsSL https://ollama.com/install.sh | sh
          # The installer may start a systemd service (as user 'ollama', with its own
          # model dir). Run our own server as the runner user so the cache above works.
          sudo systemctl stop ollama 2>/dev/null || true
          nohup ollama serve > /tmp/ollama.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:11434/api/version && break; sleep 1; done
          curl -sf http://127.0.0.1:11434/api/version
          ollama --version

      - name: Think flag
        id: think
        run: |
          case "$THINK" in
            off) echo "flag=--no-think" >> "$GITHUB_OUTPUT" ;;
            on)  echo "flag=--think" >> "$GITHUB_OUTPUT" ;;
            *)   echo "flag=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Pull model
        run: ollama pull "$MODEL"

      - name: Tool-call eval
        run: |
          python -m evals.toolcall_eval --model "$MODEL" -v --timeout 900 \
            --repeat "$REPEAT" --temperature "$TEMPERATURE" ${{ steps.think.outputs.flag }} \
            --out-dir out --markdown "out/toolcall-${{ steps.slug.outputs.slug }}.md"

      - name: Extraction eval
        if: env.RUN_EXTRACTION == 'true'
        run: |
          NO_THINK=""; [ "$THINK" = "off" ] && NO_THINK="--no-think"
          python -m evals.extraction_eval --model "$MODEL" -v $NO_THINK \
            --json "out/extraction-${{ steps.slug.outputs.slug }}.json"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results-${{ steps.slug.outputs.slug }}
          path: out/
          if-no-files-found: warn

      - name: Ollama log (on failure)
        if: failure()
        run: tail -50 /tmp/ollama.log || true

  report:
    needs: eval
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - uses: actions/download-artifact@v4
        with:
          pattern: eval-results-*
          path: results

      - name: Build summary
        run: |
          python -m evals.toolcall_eval --report results --markdown summary.md || true
          python - >> summary.md <<'EOF'
          import json, pathlib
          rows = [json.loads(p.read_text()) for p in sorted(pathlib.Path("results").rglob("extraction-*.json"))]
          if rows:
              print("\n## Extraction eval\n")
              print("| model | precision | recall | f1 | f1 en | f1 tr | negatives clean | forbidden hits |")
              print("|---|---:|---:|---:|---:|---:|---:|---:|")
              for r in sorted(rows, key=lambda r: -r["aggregate"]["f1"]):
                  a = r["aggregate"]
                  by = a.get("f1_by_lang", {})
                  print(f"| `{r['model']}` | {a['precision']} | {a['recall']} | {a['f1']} | "
                        f"{by.get('en', '—')} | {by.get('tr', '—')} | "
                        f"{a['negatives_clean']}/{a['negatives_total']} | {a['forbidden_hits']} |")
          EOF
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          cat summary.md
